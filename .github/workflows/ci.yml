name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  guards:
    name: Regression guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Every committed guard must pass against clean source.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  cycle:
    name: Red/green/guard cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Re-prove each guard end to end: it must still fail on the defect, pass
      # without it, and fail again when it returns. Catches a guard that has
      # decayed into one that passes unconditionally.
      - name: Verify every seeded defect still certifies
        run: |
          for ticket in tax-rounding coupon-restack qty-zero-ghost; do
            echo "::group::$ticket"
            ./bin/bugproof.js fetch "$ticket"
            ./bin/bugproof.js verify "$ticket" --phase all
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-evidence
          path: .bugproof/evidence/
          retention-days: 7
